name: Check and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deployments at the same time.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Images are stored with Git LFS; without this the site ships pointer files.
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests and TypeScript checks
        run: pnpm run check

      - name: Build production frontend
        run: pnpm run build

      # Pull requests are checked, but can never use production credentials.
      - name: Check deployment credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name. See docs/deployment.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Supabase CLI
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Publish the API first so the new frontend never depends on a missing route.
      - name: Deploy backend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ywwyzqlqmpcosiuszowt' }}
        run: supabase functions deploy make-server-ad6cf477 --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy frontend to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'ebclubiiuc' }}
        # Wrangler bundles ./functions (protected source download) automatically.
        run: >-
          pnpm --package=wrangler@4 dlx wrangler pages deploy dist
          --project-name="$CLOUDFLARE_PROJECT_NAME"
          --branch=main
          --commit-hash="$GITHUB_SHA"
          --commit-dirty=true
